# The daemon admin and relay commands (plan D8/T10, relay Phase 2 plan T6). Their identifiers must stay in
# step with `daemon_client::commands::COMMAND_*` and the `generate_handler!`
# block: scripts/check-tauri-permissions.js fails when a registered command is
# missing here, or when its allow-* entry is missing from [default] below.
# The wildcard capability (`windows: ["*"]`, localhost remote urls) is what lets
# the WebView reach IPC at all; it is *not* the authorization boundary — every
# command validates the Tauri-injected calling window itself (window ledger +
# navigation mirror), so a window the app did not create cannot use these.
[[permission]]
identifier = "allow-daemon-status"
description = "Allow reading the daemon's status plus the app-private quit policy (Settings → General → Daemon)"

commands.allow = ["daemon_status"]

[[permission]]
identifier = "allow-daemon-set-keep-running"
description = "Allow changing keepRunningAfterQuit, the app-private quit policy (Settings → General → Daemon)"
commands.allow = ["daemon_set_keep_running"]

[[permission]]
identifier = "allow-daemon-restart"
description = "Allow running the app-managed daemon restart transaction (Settings → General → Daemon)"
commands.allow = ["daemon_restart"]

[[permission]]
identifier = "allow-daemon-agent-stop"
description = "Allow stopping one exact Pi runtime by its full identity (closing a session tab)"
commands.allow = ["daemon_agent_stop"]

# The Pair Device block's three relay commands (relay Phase 2, plan T6): the
# same caller check as the daemon commands above gates each one.
[[permission]]
identifier = "allow-relay-status"
description = "Allow reading the daemon's relay state (Settings → General → Daemon → Pair Device)"
commands.allow = ["relay_status"]

[[permission]]
identifier = "allow-relay-set-enabled"
description = "Allow enabling or disabling the daemon's outbound relay (Settings → General → Daemon → Pair Device)"
commands.allow = ["relay_set_enabled"]

[[permission]]
identifier = "allow-relay-offer"
description = "Allow minting a one-scan relay pairing offer (Settings → General → Daemon → Pair Device)"
commands.allow = ["relay_offer"]

[[permission]]
identifier = "allow-host-list"
description = "List saved remote host profiles without credentials"
commands.allow = ["host_list"]

[[permission]]
identifier = "allow-host-add"
description = "Stage a pasted remote host offer for TOFU confirmation"
commands.allow = ["host_add"]

[[permission]]
identifier = "allow-host-confirm-tofu"
description = "Answer the calling window's pending host trust question"
commands.allow = ["host_confirm_tofu"]

[[permission]]
identifier = "allow-host-remove"
description = "Cancel and delete a local remote host profile"
commands.allow = ["host_remove"]

[[permission]]
identifier = "allow-host-status"
description = "Read remote host connection and save-recovery status"
commands.allow = ["host_status"]

[[permission]]
identifier = "allow-host-grant"
description = "Mint a host grant bound to the injected calling window"
commands.allow = ["host_grant"]

[[permission]]
identifier = "allow-host-retry-save"
description = "Retry saving an authenticated in-memory pairing candidate"
commands.allow = ["host_retry_save"]

[[permission]]
identifier = "allow-host-release"
description = "Release the calling window's host references before reload navigation"
commands.allow = ["host_release"]

[[permission]]
identifier = "allow-relay-device-list"
description = "Read safe paired-device fields from the local daemon"
commands.allow = ["relay_device_list"]

[[permission]]
identifier = "allow-relay-revoke-device"
description = "Revoke one paired device and drop its live sessions (Settings → General → Daemon → Paired devices)"
commands.allow = ["relay_revoke_device"]

# Permission set that bundles all custom command permissions.
# Referenced from capabilities/default.json as "pi-desktop:default".
[default]
description = "Default permissions bundle for Pi Desktop custom commands"
permissions = [
  "allow-daemon-status",
  "allow-daemon-set-keep-running",
  "allow-daemon-restart",
  "allow-daemon-agent-stop",
  "allow-relay-status",
  "allow-relay-set-enabled",
  "allow-relay-offer",
  "allow-host-list",
  "allow-host-add",
  "allow-host-confirm-tofu",
  "allow-host-remove",
  "allow-host-status",
  "allow-host-grant",
  "allow-host-retry-save",
  "allow-host-release",
  "allow-relay-device-list",
  "allow-relay-revoke-device",
]
