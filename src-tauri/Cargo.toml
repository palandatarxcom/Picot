[package]
name = "picot"
version = "0.5.0"
description = "Pi Agent Desktop - a desktop harness tool for pi coding agent"
authors = ["Palan DataRx"]
edition = "2021"

# Phase 1 (T1): this package is the Tauri app shell (windows, menus, dialogs,
# updater, admin client). The host stack lives in `picot-host` — zero Tauri at
# the Cargo level, enforced by scripts/check-daemon-no-tauri.js — and
# `picot-daemon` is the headless host binary. Members share this target dir.
[workspace]
members = ["crates/picot-host", "crates/picot-daemon"]
resolver = "2"

[[bin]]
name = "picot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
picot-host = { path = "crates/picot-host" }
tauri = { version = "2", features = ["image-png", "devtools", "macos-private-api", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "5"
log = "0.4"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
async-trait = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSUserDefaults"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tempfile = "3"
# The app-side daemon client (plan Task 4): the admin channel is one loopback
# WS, and the confirmed-exit waiter signals by pid.
tokio-tungstenite = "0.24"
futures-util = "0.3"
libc = "0.2"

[dev-dependencies]
# Enables the host crate's `test-seams` items (in-memory Pi bridge) for this
# package's tests only; production builds of picot-host stay feature-free.
picot-host = { path = "crates/picot-host", features = ["test-seams"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
